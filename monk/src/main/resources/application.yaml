quarkus:
  http:
    port: 8080
  # Quinoa serves the React SPA in src/main/webui: built into the app at package time
  # and run via the Vite dev server (live reload) during quarkusDev. Same-origin on :8080.
  quinoa:
    ui-dir: src/main/webui
    build-dir: dist
    enable-spa-routing: true
    # Let Quarkus REST handle the API: without this, Quinoa's SPA routing forwards
    # /queries/* to the dev server (which, via the Vite dev proxy, loops back and hangs).
    ignored-path-prefixes: /queries
  swagger-ui:
    always-include: true
    theme: "flattop"
    deep-linking: true
    display-request-duration: true
    default-models-expand-depth: 1
    try-it-out-enabled: true
    urls-primary-name: "monk API v1"
  devservices:
    enabled: false
  smallrye-openapi:
    info-title: "Monk"
    info-version: "1.0.0"
    info-description: >
      Translate and execute search queries using the **Monk DSL** across
      Elasticsearch and Solr backends.

      Submit a search request with material types and a query tree;
      monk routes to the right backends, translates the DSL into
      engine-native syntax, and merges results with normalized scores.
    info-license-name: "Apache 2.0"
    info-license-url: "https://www.apache.org/licenses/LICENSE-2.0"
  # Container image built with Quarkus Jib (no Dockerfile / Docker daemon needed at build assembly).
  container-image:
    group: monk
    name: monk
    tag: latest
    builder: jib
  jib:
    # The app is compiled to Java 25 bytecode, so the runtime base image must ship a Java 25 JRE
    # (Quarkus' default UBI base image is Java 21).
    base-jvm-image: eclipse-temurin:25-jre
  # Generates a Helm chart into target/helm at build time from the container-image/http config
  # above, instead of a hand-maintained chart.
  helm:
    enabled: true
    repository:
      deployment-target: openshift
  openshift:
    route:
      expose: true
  dev-ui:
    allow-extension-management: false
  # Bound the embedding cache so it can't grow without limit; identical knnFlat text is served
  # from here instead of re-hitting the embedding API.
  cache:
    caffeine:
      embeddings:
        maximum-size: 1000
        expire-after-write: 24h

# In production, read config from the monk-config ConfigMap via the Kubernetes API
# (quarkus-kubernetes-config). Scoped to %prod so quarkusDev and @QuarkusTest don't
# try to reach a cluster; the production build augments under %prod, so the ConfigMap
# (src/main/kubernetes/openshift.yml) is still incorporated into the generated chart.
"%prod":
  quarkus:
    kubernetes-config:
      enabled: true
      config-maps: monk-config

indexer:
  catalog:
    source: FILE
    file:
      backends: "./config/backends.json"
      config: "./config/catalog.json"
      datasources: "./config/datasources.json"

monk:
  vapi:
    endpointName: "https://example.endpoint.com/capsules/fetch"
  embedding:
    url: "https://example.embedding.com/embed"
    connect-timeout: 5s
    request-timeout: 10s
  # Outbound timeouts for the per-backend search fan-out (see BackendHttpClient).
  search:
    backend:
      connect-timeout: 5s
      request-timeout: 10s
  # Which mapping field types each query payload / aggregation may target. Consumed by query
  # validation and by JSON Schema generation. Keys are the payload type()/aggType() discriminators.
  query:
    field-types:
      text: [STRING, FREETEXT]
      range: [NUMBER, DATETIME]
      exact: [STRING, NUMBER, DATETIME, BOOLEAN]
      exists: [STRING, FREETEXT, NUMBER, DATETIME, BOOLEAN]
      prefix: [STRING, FREETEXT]
      knnFlat: [VECTOR]
  aggregation:
    field-types:
      terms: [STRING, NUMBER, DATETIME, BOOLEAN]
      unique: [STRING, NUMBER, DATETIME, BOOLEAN]
      range: [NUMBER]
      sum: [NUMBER]
      avg: [NUMBER]
      min: [NUMBER]
      max: [NUMBER]
      subfacets: [STRING, FREETEXT, NUMBER, DATETIME, BOOLEAN]
